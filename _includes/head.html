<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% if page.title and page.title != "Home" %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

{% seo %}

<!-- Structured data (invisible to visitors; helps search engines identify the person) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.author.name }}",
  "url": "{{ '/' | absolute_url }}",
  "image": "{{ '/assets/img/' | append: site.profile_image | absolute_url }}",
  "email": "mailto:{{ site.author.email }}",
  "jobTitle": "Incoming Ph.D. Student",
  "worksFor": {
    "@type": "Organization",
    "name": "Machine Learning and Intelligence Lab (MLILAB), KAIST"
  },
  "alumniOf": {
    "@type": "CollegeOrUniversity",
    "name": "Kyung Hee University"
  },
  "sameAs": [
    "https://scholar.google.com/citations?user={{ site.author.scholar }}",
    "https://github.com/{{ site.author.github }}",
    "https://www.linkedin.com/in/{{ site.author.linkedin }}"
  ]
}
</script>

<link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  (function () {
    try {
      var savedTheme = localStorage.getItem("theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.setAttribute("data-theme", savedTheme);
      }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

{% if site.enable_google_analytics and site.google_analytics %}
  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      window.dataLayer.push(arguments);
    }
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
{% endif %}
