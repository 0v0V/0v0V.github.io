text: |
  Currently, I am a research intern at the [Machine Learning and Intelligence Lab](https://mli.kaist.ac.kr) (MLILAB) at KAIST. Before joining KAIST, I received my Master's degree from the [Visual Artificial Intelligence Lab](https://visualai.khu.ac.kr/home) (VAILAB) at Kyung Hee University in 2025, advised by Prof. [Jung Uk Kim](https://sites.google.com/view/jungukkim). I also worked with Prof. [Gyeong-Moon Park](https://gyeongmoon.github.io/) through collaborative research. I received my B.S. in Software Convergence from Kyung Hee University in 2024.

  My work aims to address key challenges in **multimodal learning** and **data-centric AI**. Specifically, I focus on building user-friendly and real-world applicable multimodal systems.

