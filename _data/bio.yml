text: |
  Currently, I am a research intern and an **incoming Ph.D. student** at the [Machine Learning and Intelligence Lab](https://mli.kaist.ac.kr) (MLILAB) at KAIST, advised by Prof. [Eunho Yang](https://scholar.google.com/citations?user=UWO1mloAAAAJ). Before joining KAIST, I received my Master's degree from the [Visual Artificial Intelligence Lab](https://visualai.khu.ac.kr/home) (VAILAB) at Kyung Hee University in 2025, advised by Prof. [Jung Uk Kim](https://sites.google.com/view/jungukkim). I also worked with Prof. [Gyeong-Moon Park](https://gyeongmoon.github.io/) through collaborative research. I received my B.S. in Software Convergence from Kyung Hee University in 2024.

  My research interests are **world models**, **agentic AI**, and **data-centric AI**. I want to build agents that model how the world works and use that model to act in it.

  If you are interested in my research or collaboration, feel free to reach out :)
