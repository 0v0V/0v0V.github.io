title: Seungho Shin
description: "Seungho Shin — incoming Ph.D. student at MLILAB, KAIST. Multimodal learning and data-centric AI."
url: https://0v0v.github.io
baseurl: ""

author:
  name: Seungho Shin
  first_name: Seungho
  last_name: Shin
  korean_name: "신승호"
  email: ssh9918@kaist.ac.kr
  github: 0v0V
  linkedin: kaist-seungho-shin
  scholar: Cf_OUcIAAAAJ
  # Shows the CV icon in the social row; points at the PDF built from cv/cv.tex.
  cv: "/assets/cv/Seungho_Shin_CV.pdf"

profile_image: profile2-crop.jpg

markdown: kramdown
highlighter: rouge
permalink: pretty

kramdown:
  input: GFM

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll/scholar

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - images
  # Local-only CV sources; only the built PDF in assets/cv/ is published.
  - cv

sass:
  sass_dir: _sass
  style: compressed

# Set enable_google_analytics to true and fill google_analytics with your
# Measurement ID (e.g. G-XXXXXXXXXX) if you want analytics.
enable_google_analytics: true
google_analytics: G-574HXDJ2K7

scholar:
  style: apa
  locale: en
  source: _data
  bibliography: papers.bib
  bibliography_template: bib
  query: "@*"
  sort_by: none
  group_by: year
  group_order: descending
  bibliography_class: pub-bib
  bibliography_list_tag: div
  bibliography_item_tag: div
  last_name: [Shin]
  first_name: [Seungho]
  replace_strings: true
  join_strings: true
  details_link: false
  bibtex_filters:
    - latex
    - smallcaps
    - superscript
