description: "Seungho Shin — research intern at MLILAB, KAIST. Multimodal learning and data-centric AI."
url: https://0v0v.github.io
baseurl: ""

author:
  name: Seungho Shin
  first_name: Seungho
  last_name: Shin
  korean_name: "신승호"
  email: ssh9918@khu.ac.kr
  github: 0v0V
  linkedin: khu-seungho-shin
  scholar: LNYugtYAAAAJ
  # CV link removed per request. Uncomment the next line to show the CV icon again.
  # cv: "https://drive.google.com/file/d/1vF9Npl58S3H09WhYLVBVXg6vlfX7glH4/view?usp=sharing"

profile_image: profile2-crop.jpg

markdown: kramdown
highlighter: rouge
permalink: pretty

kramdown:
  input: GFM

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll/scholar

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - images

sass:
  sass_dir: _sass
  style: compressed

# Set enable_google_analytics to true and fill google_analytics with your
# Measurement ID (e.g. G-XXXXXXXXXX) if you want analytics.
enable_google_analytics: false
google_analytics:

scholar:
  style: apa
  locale: en
  source: _data
  bibliography: papers.bib
  bibliography_template: bib
  query: "@*"
  sort_by: none
  group_by: year
  group_order: descending
  bibliography_class: pub-bib
  bibliography_list_tag: div
  bibliography_item_tag: div
  last_name: [Shin]
  first_name: [Seungho]
  replace_strings: true
  join_strings: true
  details_link: false
  bibtex_filters:
    - latex
    - smallcaps
    - superscript
